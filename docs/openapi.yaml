components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico del recurso
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Datos inválidos
            details:
            - rating debe ser menor o igual a 5
    Unauthorized:
      description: Sesión no iniciada o credenciales inválidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Sesión no iniciada o expirada
    Forbidden:
      description: Sin permiso para la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Se requiere rol de administrador
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Evento no encontrado
    Conflict:
      description: Conflicto con el estado actual de los datos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No hay entradas disponibles suficientes
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
      required:
      - error
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Session:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id_user:
          type: integer
        name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        registration_date:
          type: string
          format: date-time
        is_admin:
          type: integer
          description: 1 si es administrador, 0 en caso contrario
    UserRegistration:
      type: object
      properties:
        name:
          type: string
          maxLength: 45
        last_name:
          type: string
          maxLength: 45
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 255
      required:
      - name
      - last_name
      - email
      - password
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 45
        last_name:
          type: string
          maxLength: 45
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 255
        is_admin:
          type: boolean
    Venue:
      type: object
      properties:
        id_venue:
          type: integer
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 45
        venue_capacity:
          type: integer
          minimum: 1
    VenueInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 45
        venue_capacity:
          type: integer
          minimum: 1
      required:
      - name
      - address
      - city
      - venue_capacity
    EventSummary:
      type: object
      properties:
        id_event:
          type: integer
        venue_id:
          type: integer
        event_type:
          type: string
          enum:
          - concert
          - sports
          - theater
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          nullable: true
        event_date:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - scheduled
          - finished
          - cancelled
        price_min:
          type: number
        price_max:
          type: number
        event_capacity:
          type: integer
        available_tickets:
          type: integer
        venue_name:
          type: string
        venue_city:
          type: string
    EventDetail:
      allOf:
      - $ref: '#/components/schemas/EventSummary'
      - type: object
        properties:
          event_details:
            type: object
            description: 'Estructura según event_type. concert: {"lineup":[{"artist":"texto","time":"HH:MM"}]}. sports: {"home_team":"texto","away_team":"texto","score":{"home":0,"away":0}}.
              theater: {"cast":[{"performer":"texto","character":"texto"}],"intermissions":[{"time":"HH:MM"}]}.'
    EventCreate:
      type: object
      properties:
        venue_id:
          type: integer
        event_type:
          type: string
          enum:
          - concert
          - sports
          - theater
        name:
          type: string
          maxLength: 100
        description:
          type: string
        image_url:
          type: string
          maxLength: 255
        event_date:
          type: string
          description: AAAA-MM-DD HH:MM[:SS]
          example: '2026-12-15 19:00:00'
        price_min:
          type: number
          minimum: 0
        price_max:
          type: number
          minimum: 0
        event_capacity:
          type: integer
          minimum: 1
        event_details:
          type: object
          description: 'Estructura según event_type. concert: {"lineup":[{"artist":"texto","time":"HH:MM"}]}. sports: {"home_team":"texto","away_team":"texto","score":{"home":0,"away":0}}.
            theater: {"cast":[{"performer":"texto","character":"texto"}],"intermissions":[{"time":"HH:MM"}]}.'
      required:
      - venue_id
      - event_type
      - name
      - description
      - event_date
      - price_min
      - price_max
      - event_capacity
      - event_details
    EventUpdate:
      type: object
      properties:
        venue_id:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
        image_url:
          type: string
          maxLength: 255
        event_date:
          type: string
          description: AAAA-MM-DD HH:MM[:SS]
          example: '2026-12-15 19:00:00'
        status:
          type: string
          enum:
          - scheduled
          - finished
          - cancelled
        price_min:
          type: number
          minimum: 0
        price_max:
          type: number
          minimum: 0
        event_details:
          type: object
          description: 'Estructura según event_type. concert: {"lineup":[{"artist":"texto","time":"HH:MM"}]}. sports: {"home_team":"texto","away_team":"texto","score":{"home":0,"away":0}}.
            theater: {"cast":[{"performer":"texto","character":"texto"}],"intermissions":[{"time":"HH:MM"}]}.'
    EventInfo:
      type: object
      properties:
        event_id:
          type: integer
        event_type:
          type: string
          enum:
          - concert
          - sports
          - theater
        event_details:
          type: object
          description: 'Estructura según event_type. concert: {"lineup":[{"artist":"texto","time":"HH:MM"}]}. sports: {"home_team":"texto","away_team":"texto","score":{"home":0,"away":0}}.
            theater: {"cast":[{"performer":"texto","character":"texto"}],"intermissions":[{"time":"HH:MM"}]}.'
    EventInfoUpdate:
      type: object
      properties:
        event_details:
          type: object
          description: 'Estructura según event_type. concert: {"lineup":[{"artist":"texto","time":"HH:MM"}]}. sports: {"home_team":"texto","away_team":"texto","score":{"home":0,"away":0}}.
            theater: {"cast":[{"performer":"texto","character":"texto"}],"intermissions":[{"time":"HH:MM"}]}.'
      required:
      - event_details
    TicketInput:
      type: object
      properties:
        zone:
          type: string
          maxLength: 45
        price_paid:
          type: number
          minimum: 0
      required:
      - zone
      - price_paid
    Ticket:
      type: object
      properties:
        id_ticket:
          type: integer
        purchase_id:
          type: integer
        zone:
          type: string
        price_paid:
          type: number
        ticket_code:
          type: string
    PurchaseCreate:
      type: object
      properties:
        event_id:
          type: integer
        tickets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TicketInput'
      required:
      - event_id
      - tickets
    PurchaseCreated:
      type: object
      properties:
        id_purchase:
          type: integer
        event_id:
          type: integer
        total_amount:
          type: number
        tickets:
          type: array
          items:
            type: object
            properties:
              zone:
                type: string
              price_paid:
                type: number
              ticket_code:
                type: string
    Purchase:
      type: object
      properties:
        id_purchase:
          type: integer
        app_user_id:
          type: integer
        event_id:
          type: integer
        purchase_date:
          type: string
          format: date-time
        total_amount:
          type: number
    PurchaseSummary:
      type: object
      properties:
        id_purchase:
          type: integer
        app_user_id:
          type: integer
        event_id:
          type: integer
        purchase_date:
          type: string
          format: date-time
        total_amount:
          type: number
        buyer_name:
          type: string
        buyer_email:
          type: string
        event_name:
          type: string
        event_type:
          type: string
          enum:
          - concert
          - sports
          - theater
        event_date:
          type: string
          format: date-time
        ticket_count:
          type: integer
    ReviewCreate:
      type: object
      properties:
        purchase_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        seat_rating:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
            maxLength: 30
      required:
      - purchase_id
      - rating
    ReviewUpdate:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        seat_rating:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
            maxLength: 30
    Review:
      type: object
      properties:
        id_review:
          type: integer
        purchase_id:
          type: integer
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        seat_rating:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          nullable: true
        review_date:
          type: string
          format: date-time
        app_user_id:
          type: integer
        event_id:
          type: integer
        author_name:
          type: string
