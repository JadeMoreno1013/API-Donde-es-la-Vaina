      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id_review: 2
                purchase_id: 9
                rating: 5
                comment: Excelente ambiente
                seat_rating: 4
                tags:
                - Buen ambiente
                - Puntualidad
                review_date: '2026-10-20T10:00:00.000Z'
                app_user_id: 3
                event_id: 5
                author_name: Laura
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
